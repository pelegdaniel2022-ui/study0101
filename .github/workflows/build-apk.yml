name: Build Android APK

on:
  push:
    branches:
      - claude/agent-management-system-J5wTy
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    # ── Fix Bug 1: GITHUB_TOKEN needs write permission to create releases ──
    permissions:
      contents: write

    # ── Fix Bug 2: Use pre-installed Android SDK, no 3rd-party action needed ──
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # ── 3. Java (required for Android Gradle) ────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 4. Accept Android SDK licenses (Fix Bug 3: use correct path) ─────
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      # ── 5. Install npm dependencies ───────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 6. Build web app ──────────────────────────────────────────────────
      - name: Build web app (Vite)
        run: npm run build

      # ── 7. Capacitor: add Android + sync ──────────────────────────────────
      - name: Add Android platform
        run: npx cap add android
        continue-on-error: true   # ok if already added

      - name: Sync Capacitor
        run: npx cap sync android

      # ── 8. Make Gradle wrapper executable ────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 9. Build debug APK ────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # ── 10. Rename APK ────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/PhysicsStudy.apk

      # ── 11. Upload as workflow artifact (always available) ────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsStudy-APK
          path: output/PhysicsStudy.apk
          retention-days: 30

      # ── 12. Create/update GitHub Release ─────────────────────────────────
      - name: Delete old 'latest' release if exists
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PhysicsStudy — Latest Build"
          body: |
            ## PhysicsStudy APK

            **How to install on your Samsung:**
            1. Download `PhysicsStudy.apk` below
            2. Open it on your Samsung tablet
            3. If asked, enable "Install unknown apps" for your browser
            4. Tap Install

            Built from branch `claude/agent-management-system-J5wTy`
          files: output/PhysicsStudy.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
